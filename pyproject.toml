[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reportlab_layout"
dynamic = ["version"]
description = "A cursor-driven layout layer on top of reportlab: the flow of a document, with the canvas always within reach."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "antnardo", email = "antnardo@users.noreply.github.com" }]
keywords = ["pdf", "reportlab", "layout", "canvas", "typesetting", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Printing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    "pillow>=10.0",
    "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/antnardo/reportlab_layout"
Documentation = "https://github.com/antnardo/reportlab_layout/blob/main/docs/DOC.md"
Repository = "https://github.com/antnardo/reportlab_layout"
Issues = "https://github.com/antnardo/reportlab_layout/issues"
Changelog = "https://github.com/antnardo/reportlab_layout/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pypdf>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

# La version vit dans le module : une seule source, que le workflow de
# publication compare au tag.
[tool.hatch.version]
path = "src/reportlab_layout/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reportlab_layout"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode look-alikes: the prose uses typographic dashes

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "ink: rasterises a page with pdftoppm to measure where the ink lands; skipped without poppler",
]

[tool.coverage.run]
source = ["src/reportlab_layout"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = ["src"]
explicit_package_bases = true
ignore_missing_imports = true
