name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        reportlab: ["reportlab>=4,<5", "reportlab>=5,<6"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install
        run: |
          uv sync --group dev
          uv pip install "${{ matrix.reportlab }}"
      - name: reportlab version under test
        run: uv run python -c "import reportlab, sys; print(reportlab.Version, sys.version)"
      - name: Lint
        run: |
          uv run ruff check src tests scripts examples
          uv run ruff format --check src tests scripts examples
      - name: Test
        run: uv run pytest -q

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --group dev
      - run: uv run mypy

  ink:
    # The ink tests rasterise pages with pdftoppm, which the runners lack, so
    # the test job skips them. Poppler draws each standard font with a clone,
    # and installing the URW ones makes it a known clone: Nimbus Roman has
    # Times's cap height, and Nimbus Sans's capitals stand 11 thousandths of an
    # em above Helvetica's, which the tests allow for.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install poppler and the URW fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils fonts-urw-base35 fontconfig
      - name: Fonts standing in for Helvetica and Times
        run: |
          fc-match Helvetica
          fc-match Times-Roman
      - run: uv sync --group dev
      - name: Ink tests
        run: uv run pytest -q -m ink -rs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
